plugins {
    id 'com.android.application'
}

android {
    namespace 'com.newfur.cimbar'
    compileSdk 34

    defaultConfig {
        applicationId "com.newfur.cimbar"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        setProperty("archivesBaseName", "Cimbar-Transfer-v" + versionName)
    }

    signingConfigs {
        release {
            // Default to signing with debug keystore so release builds produce an immediately installable APK.
            // If custom release keystore properties are passed via command line or gradle.properties, use them.
            if (project.hasProperty("RELEASE_STORE_FILE") && file(RELEASE_STORE_FILE).exists()) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            } else {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
}

// Automatically sync latest web assets before compilation
tasks.register('syncWebAssets', Copy) {
    from fileTree("${projectDir}/../../web")
    into file("${projectDir}/src/main/assets/web")
}

preBuild.dependsOn syncWebAssets
